[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvstore"
version = "0.1.0"
description = "Demonstration MultiValue store: records in genuine AM/VM/SM format"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[project.scripts]
mvstore = "mvstore.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mvstore"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
